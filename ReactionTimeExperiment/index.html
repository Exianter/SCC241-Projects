<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reaction Test</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<div class="console">
  <div class="masthead">
    <h1>Reaction Test</h1>

    <div class="header-info">
      <span class="mode">10 trials</span>
    </div>
  </div>
  <p class="subline" id="intro">
    Each trial arms after a short wait, then shows a shape. Press <strong>G</strong> if it matches the mission or <strong>H</strong> if it does not.
    Ten trials, then your results export as a .csv.
  </p>

  <div class="ticks" id="ticks"></div>

  <div class="stage">
    <h2 class="mission-text" id="missionText"></h2>
    <div class="stimulus" id="stimulus" aria-label="Reaction stimulus"></div>
    <div class="status" id="status">Press start when you're ready</div>
    <div class="readout" id="readout"></div>
  </div>

  <button class="btn" id="primaryBtn">Start experiment</button>

  <div id="resultsBlock" style="display:none;">
    <div class="stats">
      <div class="stat"><div class="v" id="statAvg">–</div><div class="l">avg ms</div></div>
      <div class="stat"><div class="v" id="statMin">–</div><div class="l">fastest</div></div>
      <div class="stat"><div class="v" id="statMax">–</div><div class="l">slowest</div></div>
    </div>
    <table class="results">
      <thead><tr><th>Trial</th><th class="num">Reaction (ms)</th></tr></thead>
      <tbody id="resultsBody"></tbody>
    </table>
    <div class="btn-row">
      <button class="btn secondary" id="restartBtn">Run again</button>
      <button class="btn" id="exportBtn">Export .csv</button>
    </div>
  </div>

  <div class="scoreboard" aria-live="polite">
    <span class="correct-count">Correct: <strong id="correctCount">0</strong></span>
    <span class="incorrect-count">Incorrect: <strong id="incorrectCount">0</strong></span>
  </div>
</div>

<script src="script.js?v=3"></script>
</body>
</html>
