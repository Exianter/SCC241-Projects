<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whack-a-Mole</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="hud">
  <div id="stats">
    <div id="score">Score: 0</div>
    <div id="styleRank" aria-live="polite">Style: Dismal (1x)</div>
    <div id="rounds">Round: 0 / 60</div>
    <div id="stage">Stage: 0 / 6</div>
</div>
  <div id="message">Hit a mole! Green adds points, red subtracts points.</div>
</div>

<div id="lives" aria-live="polite">Lives: 5</div>
<div id="arena">
    <div id="arenaLabel">STAGE 1 ARENA</div>
</div>

<button id="startBtn">Start</button>

<div id="stageTransition">
    <div id="transitionContent">
        <h1 id="transitionTitle">STAGE 1</h1>
        <p id="transitionMessage">GET READY!</p>
        <div id="countdown">3</div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
